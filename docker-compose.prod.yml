services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: runtime
    # 同じVPS上の他プロジェクト(devex-api等)とイメージタグが衝突しないよう、プロジェクト固有名にする。
    image: quaiz-api-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - internal
      - edge
    # VPS共有のTraefik(quaiz-apiリポジトリ外。構築手順はdevex-apiのOPERATIONS.md「共有Traefikの導入」参照)
    # 経由でのみ外部から到達する。このサービス自体はホストへポートを公開しない。
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.quaiz-api.rule=Host(`quaiz-api.uandi-tech.com`)"
      - "traefik.http.routers.quaiz-api.entrypoints=websecure"
      - "traefik.http.routers.quaiz-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.quaiz-api.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
  # Traefik側のcompose(VPS共有、quaiz-apiリポジトリ外)が作成する外部ネットワーク。
  # `docker network create edge`済みであること、またはTraefik側composeで作成済みであることが前提。
  edge:
    external: true
