events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    # 80番: Let's EncryptのHTTP-01チャレンジのみ素通しし、それ以外は常にHTTPSへリダイレクトする。
    # certbotの証明書更新(webrootモード)は稼働中もこの80番経由で行うため、リダイレクト対象から
    # /.well-known/acme-challenge/ を除外している。
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # DOMAIN は certbot で取得した実際のドメイン名に置き換えること
        # (certbotの出力先 /etc/letsencrypt/live/<domain>/ が /etc/nginx/certs にマウントされるため、
        #  このパスの "DOMAIN" 部分がそのまま実際のドメイン名のディレクトリ名になる)
        ssl_certificate     /etc/nginx/certs/live/DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/DOMAIN/privkey.pem;

        client_max_body_size 10m;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend/health;
        }
    }
}
